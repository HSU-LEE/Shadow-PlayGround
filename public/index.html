<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13100a" />
    <meta
      name="google-site-verification"
      content="XksL7XVPE_iT2dn2rlfW7GUDFH6qBERQF0MAFqzX_n0"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Shadow PlayGround</title>
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="stage-wrap">
        <button
          type="button"
          id="menuBtn"
          class="menu-btn"
          data-i18n-aria="aria.menuOpen"
        >
          ☰
        </button>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="outputCanvas"></canvas>
        <canvas id="fxCanvas"></canvas>
        <canvas id="particleCanvas" aria-hidden="true"></canvas>

        <div class="stage-hud" id="stageHud">
          <p class="hud-spell" id="hudSpell">…</p>
          <p class="hud-challenge" id="challengeTitle"></p>
          <div class="hud-progress-wrap" aria-hidden="true">
            <div class="hud-progress" id="challengeProgress"></div>
          </div>
          <p class="hud-combo" id="comboDisplay" aria-live="polite"></p>
          <p class="hud-coach" id="hudCoach" aria-live="polite"></p>
        </div>

        <div class="start-overlay" id="startOverlay">
          <div id="startSpinner" class="start-spinner hidden" aria-hidden="true"></div>
          <button type="button" id="startBtn" data-i18n="start.btn">시작</button>
          <p id="gestureTip" data-i18n="start.tipDefault"></p>
        </div>

        <div class="sr-only">현재 그림자: <strong id="spellName">…</strong></div>
      </section>
    </main>

    <div id="sidebarBackdrop" class="sidebar-backdrop hidden" aria-hidden="true"></div>
    <aside id="sidebar" class="sidebar hidden" data-i18n-aria="aria.sidebar">
      <button
        type="button"
        id="closeSidebarBtn"
        class="close-sidebar-btn"
        data-i18n-aria="aria.menuClose"
      >
        ×
      </button>
      <h2>Shadow PlayGround</h2>

      <details class="sidebar-details" open>
        <summary data-i18n="sidebar.github"></summary>
        <a href="https://github.com/HSU-LEE" target="_blank" rel="noopener noreferrer">
          github.com/HSU-LEE
        </a>
      </details>

      <details class="sidebar-details" open>
        <summary data-i18n="sidebar.playModes"></summary>
        <div class="mode-toggle" role="group" data-i18n-aria="aria.playModeGroup">
          <button type="button" class="mode-btn mode-btn-active" id="modeFreeBtn" data-i18n="sidebar.modeFree"></button>
          <button type="button" class="mode-btn" id="modeChallengeBtn" data-i18n="sidebar.modeChallenge"></button>
          <button type="button" class="mode-btn" id="modeLearnBtn" data-i18n="sidebar.modeLearn"></button>
        </div>
      </details>

      <details class="sidebar-details" open>
        <summary data-i18n="sidebar.settings"></summary>
        <label class="settings-row">
          <input type="checkbox" id="perfToggle" />
          <span data-i18n="settings.perf"></span>
        </label>
        <label class="settings-row">
          <input type="checkbox" id="soundToggle" checked />
          <span data-i18n="settings.sound"></span>
        </label>
        <label class="settings-row settings-lang">
          <span data-i18n="settings.lang"></span>
          <select id="langSelect" aria-label="Language">
            <option value="ko">한국어</option>
            <option value="en">English</option>
          </select>
        </label>
      </details>

      <details class="sidebar-details" open>
        <summary data-i18n="sidebar.about"></summary>
        <p data-i18n="sidebar.aboutBody"></p>
        <p class="sidebar-hint" data-i18n="sidebar.learnHint"></p>
      </details>

      <details class="sidebar-details">
        <summary data-i18n="sidebar.support"></summary>
        <p>토스뱅크 1908-1194-4861</p>
      </details>

      <details class="sidebar-details">
        <summary data-i18n="sidebar.contact"></summary>
        <p>harry.srobot.2011@gmail.com</p>
      </details>
    </aside>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
